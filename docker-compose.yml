services:
  app:
    build: .
    ports:
      - "8000:8000"
    # 读取仓库根目录的 .env（不存在也可以启动；需要 Docker Compose v2.24+）
    env_file:
      - path: .env
        required: false
    environment:
      # ComfyUI 跑在宿主机时用 host.docker.internal；也可以改成局域网 / 云端地址
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
